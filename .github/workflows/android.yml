name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          set -eux
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -x "${sdk}/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          yes | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk}" --licenses >/dev/null
          "${sdk}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk}" "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests and build debug APK
        working-directory: apps/android
        run: |
          set -o pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export ANDROID_HOME="${sdk}"
          export ANDROID_SDK_ROOT="${sdk}"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee "${RUNNER_TEMP}/gradle.log"
      - name: Publish build error
        if: failure()
        run: |
          awk '/What went wrong/,/Exception is/' "${RUNNER_TEMP}/gradle.log" | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-app-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
