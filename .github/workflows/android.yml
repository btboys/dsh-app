name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          set -eux
          sdk="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${sdk}/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q cmdline-tools.zip -d "${sdk}/cmdline-tools"
          mv "${sdk}/cmdline-tools/cmdline-tools" "${sdk}/cmdline-tools/latest"
          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "${sdk}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${sdk}/platform-tools" >> "${GITHUB_PATH}"
          yes | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk}" --licenses >/dev/null
          "${sdk}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk}" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: apps/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee "${RUNNER_TEMP}/gradle.log"
      - name: Publish build error
        if: failure()
        run: |
          tail -n 40 "${RUNNER_TEMP}/gradle.log" | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-app-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
